name: "Build and deploy dev"
on:
  workflow_dispatch:

jobs:
  build:
    name: "build"
    runs-on: "ubuntu-latest"

    permissions:
      contents: "read"
      id-token: "write"
      packages: "write"


    steps:
      - uses: "actions/checkout@v7.0.1"
      - name: "Set up node and install pnpm packages"
        uses: navikt/familie-baks-gha-workflows/.github/actions/setup-node-pnpm@main # ratchet:exclude
        with:
          node-version: '24'
          reader-token: ${{ secrets.READER_TOKEN }}

      - name: "Build application"
        run: "pnpm build"

      - name: "Upload to cdn"
        uses: nais/deploy/actions/cdn-upload/v2@master
        with:
          team: teamfamilie
          source: ./dist/client/_astro
          destination: 'familie-ba-minside-mikrofrontend'
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}

      - name: "Build and push"
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: teamfamilie
          pull: true

    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  update-manifest-dev:
    uses: navikt/tms-deploy/.github/workflows/oppdater-mikrofrontend-manifest-v3.yaml@main
    needs: build
    with:
      id: "familie-ba-minside-mikrofrontend"
      url: "http://familie-ba-minside-mikrofrontend.teamfamilie"
      appname: "familie-ba-minside-mikrofrontend"
      namespace: "teamfamilie"
      cluster: dev-gcp
      commitmsg: ${{ github.event.head_commit.message}}
      fallback: "fallback"
      ssr: true
    secrets: inherit

  deploy-dev:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      id-token: "write"
    needs: [ build, update-manifest-dev ]
    steps:
      - uses: "actions/checkout@v7.0.1"
      - name: "Deploy to dev"
        uses: "nais/deploy/actions/deploy@v2"
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais/dev-gcp/nais.yaml
          VAR: image=${{ needs.build.outputs.image }},version=${{ github.sha }}
