# Flat node_modules (som npm) slik at Docker-imaget, som kopierer inn hele
# node_modules, får en resolverbar struktur i produksjon. Samme oppsett som de
# andre familie-frontendene som er migrert til pnpm.
nodeLinker: hoisted
# Nye avhengigheter pinnes eksakt (pnpm 11 leser bare auth/registry fra .npmrc,
# så save-exact der har ingen effekt — tilsvarer 'save-exact=true' i den gamle .npmrc).
saveExact: true
# Avhengigheter får ikke kjøre (pre|post)install-scripts (sikkerhetstiltak).
# Tilsvarer 'ignore-scripts=true' i den gamle .npmrc for avhengighetene. Merk:
# npm hoppet også over repoets eget prepare-script (husky), så pre-commit-hooken
# har vært inaktiv lokalt; med pnpm kjører prepare, og hooken er aktiv igjen.
# NB: en ny avhengighet med install-script gjør at 'pnpm install' feiler med
# ERR_PNPM_IGNORED_BUILDS og skriver en ugyldig placeholder inn i denne fila —
# erstatt den med 'pakke: false' (eller 'true' for å tillate scriptet).
allowBuilds:
  esbuild: false
  sharp: false
# Egne pakker fra GitHub Packages tas i bruk med en gang (pnpm venter ellers
# minimumReleaseAge, som standard 1 dag, før nye versjoner installeres).
minimumReleaseAgeExclude:
  - '@navikt/*'
  - '@nais/*'
